name: Diagnose front-page sources (temporary)

# Temporary end-to-end dry run of the fixed fetch_frontpages.py for the July
# 2026 Kiosko freeze: downloads every cover from the runner (the IP that
# matters) and prints the resulting manifest WITHOUT committing anything.
# Delete this file once the fix is merged to main.

on:
  # push-triggered because workflow_dispatch can't target a workflow that only
  # exists on a feature branch; every push to the fix branch re-runs the probe.
  push:
    branches:
      - claude/newspaper-refresh-fix-c1jn5u
    paths:
      - scripts/fetch_frontpages.py
      - .github/workflows/diag-frontpages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir requests Pillow pypdfium2
      - name: Full front-page refresh (dry run, nothing committed)
        run: python scripts/fetch_frontpages.py
      - name: Show resulting manifest
        run: cat frontpages/manifest.json
