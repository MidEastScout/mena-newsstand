# TEMPORARY, one-off diagnostic. Confirms the Cloudflare Worker redeploy picked
# up the new /click + /clicks endpoints (added for the Headlines tab's
# on-site-click ranking signal). Safe to delete once confirmed working.
name: Verify click-tracking Worker (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Worker URL
        id: cfg2
        run: echo "api=$(python3 -c "import json;print(json.load(open('push-config.json'))['api'])")" >> "$GITHUB_OUTPUT"
      - name: Check /vapidPublicKey (sanity — pre-existing endpoint)
        run: |
          code=$(curl -sS -o /tmp/vapid.txt -w "%{http_code}" "${{ steps.cfg2.outputs.api }}/vapidPublicKey")
          echo "vapidPublicKey -> HTTP $code"
          cat /tmp/vapid.txt; echo
      - name: POST a test click
        run: |
          code=$(curl -sS -o /tmp/click.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"url":"https://example.com/__verify-click-worker-test","source":"__test","title":"deploy verification ping"}' \
            "${{ steps.cfg2.outputs.api }}/click")
          echo "POST /click -> HTTP $code"
          cat /tmp/click.json; echo
      - name: GET /clicks and confirm the test click is counted
        run: |
          code=$(curl -sS -o /tmp/clicks.json -w "%{http_code}" "${{ steps.cfg2.outputs.api }}/clicks?days=1")
          echo "GET /clicks -> HTTP $code"
          cat /tmp/clicks.json; echo
          python3 scripts/_verify_click_check.py
