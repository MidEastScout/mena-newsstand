name: Verify front-page fix (temporary)

# One-off, post-merge verification of the Kiosko-freeze fix, decoupled from the
# (occasionally slow) headlines step so it exercises ONLY the changed code:
# fetch_frontpages.py (new paperboy/gztpage/kioskopage sources + magic-byte
# validation) and report_stale_frontpages.py (issue open/close). Nothing is
# committed; the only side effect is the staleness issue the reporter is meant
# to open. Delete this file after confirming.

on:
  push:
    branches:
      - claude/newspaper-refresh-fix-c1jn5u
    paths:
      - .github/workflows/verify-frontpage-fix.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir requests Pillow pypdfium2
      - name: Full front-page refresh (dry run, nothing committed)
        run: python scripts/fetch_frontpages.py
      - name: Report chronically stale front pages (opens the real issue)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/report_stale_frontpages.py
      - name: Show resulting manifest
        run: cat frontpages/manifest.json
