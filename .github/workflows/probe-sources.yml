# TEMPORARILY REPURPOSED ON THIS BRANCH: dispatching probe-mostread.yml directly
# is impossible until it lands on main (GitHub only registers workflows from the
# default branch), so this already-registered diagnostic slot runs the most-read
# probe when dispatched with ref=claude/headlines-tab-overhaul-kebcdu. Restore
# from main before merging.
name: Probe sources (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --no-cache-dir requests feedparser
      - run: python scripts/probe_mostread.py
