name: MENA Newsstand

# WHAT THIS WORKFLOW DOES (plain English)
# =========================================
# EVERY RUN (about every 30 minutes — see the self-perpetuating loop below):
#   - scripts/fetch_headlines.py  → refreshes headlines.json
#   - scripts/build_pulse.py      → refreshes pulse.json (word cloud)
#   - scripts/build_trends.py     → refreshes trends.json (outlet/topic trends)
#   - scripts/build_topstories.py → clusters headlines into top_stories.json
#                                   (Claude if ANTHROPIC_API_KEY set, else a
#                                    keyword + named-entity heuristic)
#
# EVERY 6 HOURS (first run crossing 00:00 / 06:00 / 12:00 / 18:00 Israel time):
#   - scripts/build_briefing.py   → fetches world feeds + MENA headlines,
#                                   calls Gemini, writes briefing.json
#
# FRONT PAGES (scripts/fetch_frontpages.py):
#   - ~07:00 Israel (morning) + ~14:00 Israel (afternoon): full refresh of every
#     cover (the afternoon pass also catches late re-plates).
#   - Every ~30-min run in between: a fill-only catch-up that re-fetches ONLY the
#     papers still showing yesterday's edition (US + European/Turkish titles are
#     scanned upstream hours after the 07:00 grab). It skips covers already
#     current and goes quiet once they all are, so a late edition is picked up
#     within ~30 min instead of waiting for the afternoon pass.
#
# PUBLISHING TO GITHUB PAGES happens in a SEPARATE workflow (publish-pages.yml),
# which the `run` job below dispatches right after it commits fresh data. It used
# to be a `deploy` job in THIS file, but a transient GitHub 503 while resolving
# that job's actions (the "Set up job / Getting action download info" phase) is a
# setup-phase failure that job-level continue-on-error CANNOT catch, so it
# reddened and emailed the whole refresh even though the data had committed fine.
# Splitting the deploy out means a deploy hiccup can never fail this run again.
#
# HOW THE ~30-MIN REFRESH STAYS ALIVE (self-perpetuating loop)
# ============================================================
# GitHub's built-in `schedule` cron is unreliable for this repo (it silently
# drops most runs), and we no longer depend on any external pinger. Instead the
# workflow keeps ITSELF on schedule: after each run, the `rearm` job waits
# ~28 minutes and then triggers the next run through the GitHub API. Work time
# (~2 min) + wait (~28 min) ≈ a 30-minute cadence.
#
# This needs a Personal Access Token saved as the `DISPATCH_PAT` secret
# (fine-grained, repo = mena-newsstand, permission Actions: Read and write).
# The same secret is used to dispatch the publish-pages.yml deploy.
#
# Safety / robustness:
#   - The `rearm` job uses concurrency cancel-in-progress, so only ONE timer is
#     ever waiting. Overlapping triggers (manual, schedule, loop) collapse back
#     into a single ~30-min loop instead of multiplying.
#   - The `schedule` below still fires occasionally; if the self-loop ever dies
#     (a run cancelled at the wrong moment, or the PAT lapses), a scheduled run
#     restarts it.
#   - `workflow_dispatch` allows manual "refresh now" runs and an optional
#     external heartbeat.
#   - If DISPATCH_PAT is not set, `rearm` is a no-op and the site falls back to
#     the (unreliable) schedule — nothing breaks.
#
# scripts/plan_run.py acts as a gatekeeper: it checks the current time in
# Israel and state/daily.json so each timed task (briefing, front pages)
# runs once per slot — even though headlines refresh on every run.

on:
  schedule:
    # Safety net ONLY — the ~28-min self-dispatch loop (see `rearm`) is primary.
    # Kept at */15: the `rearm` job itself can silently die (observed 2026-07-09 —
    # its job sat "queued" with no runner for 15 min and was cancelled, so no next
    # run was ever dispatched and the site went stale for 40+ min with no error
    # surfaced anywhere). A frequent watchdog bounds how long that failure mode
    # can leave the site stale.
    - cron: '*/15 * * * *'
  workflow_dispatch:          # manual "refresh now" + the loop's own dispatch
    inputs:
      refresh_frontpages:
        description: 'Force-refresh front-page images now'
        type: boolean
        default: false
      refresh_briefing:
        description: 'Force-rebuild the World Briefing now (no email)'
        type: boolean
        default: false
      force_push:
        description: 'Force-send a push notification now (ignores the change + hourly gates)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # report_stale_frontpages.py opens/closes the staleness issue

jobs:
  run:
    runs-on: ubuntu-latest
    # Serialise the actual work so concurrent runs never race on git push.
    # (Per-job, so the rearm timer below does not block manual refreshes.)
    concurrency:
      group: newsstand-data
      cancel-in-progress: false
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Powers semantic Top-5 story clustering in build_topstories.py. Optional:
      # if unset, that builder falls back to a keyword + named-entity heuristic.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Azure Translator (free tier) powers the Hebrew translation of headlines,
      # snippets and pulse terms. Add both as repo secrets; Hebrew falls back to
      # English if they're absent.
      AZURE_TRANSLATOR_KEY:    ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
      # Web push — hourly "top stories" notifications (scripts/send_push.py).
      # ALL optional: if these are unset the sender logs a notice and exits 0,
      # so nothing breaks until you finish the one-time setup in
      # PUSH-NOTIFICATIONS.md.
      #   PUSH_API          → your Cloudflare Worker base URL
      #   PUSH_ADMIN_TOKEN  → bearer guarding the Worker's list/prune endpoints
      #   VAPID_PRIVATE_KEY → base64url private key from gen_vapid_keys.py
      #   VAPID_SUBJECT     → mailto: contact for the push services
      PUSH_API:          ${{ secrets.PUSH_API }}
      PUSH_ADMIN_TOKEN:  ${{ secrets.PUSH_ADMIN_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Plan the run
        env:
          FORCE_FRONTPAGES:  ${{ github.event.inputs.refresh_frontpages }}
          FORCE_BRIEFING:    ${{ github.event.inputs.refresh_briefing }}
        run: python scripts/plan_run.py

      - name: Fetch headlines
        run: python scripts/fetch_headlines.py

      # Media Pulse word cloud — cheap, no API, runs every refresh.
      - name: Build media pulse
        continue-on-error: true
        run: python scripts/build_pulse.py

      # Outlet & Topic Trends — cheap, no API, runs every refresh.
      - name: Build topic trends
        continue-on-error: true
        run: python scripts/build_trends.py

      # Top-5 cross-outlet story clustering, recomputed every refresh. Uses the
      # Claude API when ANTHROPIC_API_KEY is set (semantic clustering + neutral
      # summaries); otherwise falls back to a no-key keyword + named-entity
      # heuristic. continue-on-error so an API hiccup never blocks the commit.
      - name: Build top stories
        continue-on-error: true
        run: python scripts/build_topstories.py

      # Hourly "top stories" web-push notification. Self-gating in send_push.py:
      # it only fires when the top-story set has CHANGED since the last push AND
      # at least ~1h has passed (state/push_state.json), unless force_push is set.
      # continue-on-error so a push-service or Worker hiccup never blocks the
      # data commit. No-op (exits 0) until the push secrets are configured.
      - name: Send push notifications
        continue-on-error: true
        env:
          FORCE_PUSH: ${{ github.event.inputs.force_push }}
        run: python scripts/send_push.py

      # Build the world briefing every 6 hours. continue-on-error so a Gemini
      # quota or network hiccup never blocks the headlines commit or email.
      - name: Build world briefing
        if: ${{ env.DO_BRIEFING == 'true' }}
        continue-on-error: true
        run: python scripts/build_briefing.py

      # Front-page images: full refresh on the morning + afternoon slots, plus a
      # fill-only catch-up in between (FRONTPAGES_FILL_ONLY, set by plan_run via
      # $GITHUB_ENV) that re-fetches only the papers still a day behind.
      # continue-on-error: a CDN outage must never block headlines or email.
      - name: Fetch front pages
        if: ${{ env.DO_FRONTPAGES == 'true' }}
        continue-on-error: true
        run: python scripts/fetch_frontpages.py

      # Chronic staleness (a cover that has missed 2+ expected editions) means
      # a dead source, which retries can't fix — so escalate it from a log
      # warning to a repo issue that opens when covers stop refreshing and
      # closes itself on recovery. This is what turned the July 2026 Kiosko
      # freeze from a silent 4-day outage into something visible.
      - name: Report chronically stale front pages
        if: ${{ env.DO_FRONTPAGES == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/report_stale_frontpages.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add headlines.json state/daily.json
          # coverage.json feeds the Headlines tab's "all recent headlines"
          # expander (and Trends), so it must ship to the site like the rest.
          git add coverage.json 2>/dev/null || true
          git add pulse.json 2>/dev/null || true
          git add briefing.json 2>/dev/null || true
          git add trends.json state/trends_history.json 2>/dev/null || true
          git add top_stories.json state/topstories_summaries.json 2>/dev/null || true
          git add state/push_state.json 2>/dev/null || true
          git add state/pulse_terms_he.json state/headlines_he.json 2>/dev/null || true
          git add frontpages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "chore: refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                echo "Pushed."; break
              fi
              echo "Push attempt $i failed; retrying…"; sleep $((i * 3))
            done
          fi

      # Publish the freshly-committed data to GitHub Pages. This runs in its OWN
      # workflow (publish-pages.yml) so a transient GitHub infra hiccup during the
      # deploy job's setup — the "Getting action download info" phase, which
      # job-level continue-on-error does NOT cover — can never fail this
      # data-refresh run again. Fire it now so the live site updates within a
      # minute of the commit above.
      #
      # Best-effort: a failed dispatch NEVER fails the refresh. Both a schedule
      # backstop inside publish-pages.yml and the next ~30-min run's dispatch will
      # re-trigger the deploy, so a dropped dispatch self-heals. Reuses the same
      # DISPATCH_PAT self-dispatch pattern as `rearm` (the default GITHUB_TOKEN
      # cannot trigger a workflow_dispatch that actually runs).
      - name: Trigger the Pages deploy
        continue-on-error: true
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -z "$DISPATCH_PAT" ]; then
            echo "DISPATCH_PAT not set — skipping deploy dispatch; publish-pages.yml's"
            echo "schedule backstop will publish the site instead."
            exit 0
          fi
          # Retry transient failures (network blips, 5xx, secondary rate limits).
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/deploy_resp.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $DISPATCH_PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-pages.yml/dispatches" \
              -d '{"ref":"main"}') || code="000"
            echo "Deploy dispatch attempt $attempt: HTTP $code"
            if [ "$code" = "204" ]; then
              echo "Deploy queued."; break
            fi
            cat /tmp/deploy_resp.json 2>/dev/null || true
            sleep $((attempt * 3))
          done

  # ---------------------------------------------------------------------------
  # Self-perpetuating timer: wait ~28 min, then trigger the next run so the site
  # refreshes about every 30 minutes without relying on GitHub's flaky cron.
  # ---------------------------------------------------------------------------
  rearm:
    needs: run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Only ONE timer may wait at a time: a newer run cancels the older timer,
    # so overlapping triggers collapse into a single loop instead of stacking.
    concurrency:
      group: newsstand-rearm
      cancel-in-progress: true
    steps:
      - name: Wait, then dispatch the next run
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          if [ -z "$DISPATCH_PAT" ]; then
            echo "DISPATCH_PAT secret is not set — skipping self-dispatch."
            echo "Add a fine-grained PAT (repo: mena-newsstand, Actions: Read"
            echo "and write) as the DISPATCH_PAT secret to enable the"
            echo "self-perpetuating ~30-minute refresh loop."
            exit 0
          fi
          # Pace the loop: ~28 min wait + ~2 min of work ≈ 30-minute cadence.
          # (Public repo → Actions minutes are free, so a waiting job is fine.)
          echo "Waiting ~28 min before triggering the next run…"
          sleep 1680
          echo "Dispatching the next run…"
          # Retry transient failures (network blips, 5xx, secondary rate limits)
          # with backoff. A single dropped dispatch would otherwise break the
          # whole chain, and the schedule backstop is unreliable for this repo.
          ok=""
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $DISPATCH_PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fetch-headlines.yml/dispatches" \
              -d '{"ref":"main"}') || code="000"
            echo "Attempt $attempt: GitHub API responded HTTP $code"
            if [ "$code" = "204" ]; then
              ok="yes"; break
            fi
            cat /tmp/resp.json 2>/dev/null || true
            sleep $((attempt * 5))
          done
          if [ -n "$ok" ]; then
            echo "Next run queued — loop continues."
          else
            echo "::warning::Self-dispatch failed after 5 attempts. The schedule"
            echo "safety net will restart the loop; check that DISPATCH_PAT is"
            echo "valid and has Actions: Read and write on this repo."
          fi
