# Cloudflare Worker config for the push subscription store.
# Deploy with:  cd push && npx wrangler deploy
# See PUSH-NOTIFICATIONS.md for the full, plain-language walkthrough.

name = "mena-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Subscriptions live in this KV namespace. Create it once with:
#   npx wrangler kv namespace create SUBS
# then paste the printed id below (replacing REPLACE_WITH_KV_NAMESPACE_ID).
kv_namespaces = [
  { binding = "SUBS", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[vars]
# The base64url VAPID *public* key (safe to expose — the browser needs it).
# Generate a keypair with:  python scripts/gen_vapid_keys.py
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"

# CORS: lock the write endpoints to your site's origin once you have a domain.
# "*" is fine to start (subscriptions are not sensitive), or set e.g.
# "https://mideastscout.github.io".
ALLOW_ORIGIN = "*"

# NOTE: ADMIN_TOKEN is a *secret*, not a var. Set it with:
#   npx wrangler secret put ADMIN_TOKEN
# and give the SAME value to the GitHub Action as the PUSH_ADMIN_TOKEN secret.
